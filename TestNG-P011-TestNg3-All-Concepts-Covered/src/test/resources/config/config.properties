# ---------------------------------------------------------------------------
# Base configuration. Everything here can be overridden, in this order:
#   1. -Dkey=value on the command line   (highest priority)
#   2. config/<env>.properties           (env = qa | staging, -Denv=staging)
#   3. this file                         (lowest priority)
# See com.sk.core.ConfigManager.
# ---------------------------------------------------------------------------

# Application under test -----------------------------------------------------
base.url                  = https://www.saucedemo.com
app.name                  = Swag Labs

# Browser --------------------------------------------------------------------
browser                   = chrome
headless                  = false
maximize                  = true

# Timeouts (seconds). Implicit wait is intentionally 0 - we never mix implicit
# and explicit waits, that combination produces unpredictable wait times.
implicit.wait             = 0
explicit.wait             = 15
page.load.timeout         = 45

# Retry ----------------------------------------------------------------------
retry.max.attempts        = 2

# Reporting ------------------------------------------------------------------
screenshot.on.failure     = true
screenshot.dir            = test-output/screenshots
custom.report.dir         = test-output/custom-report

# Excel driven data ----------------------------------------------------------
excel.testdata.path       = src/test/resources/testdata/SwagLabsTestData.xlsx
excel.results.path        = test-output/excel/SwagLabsTestData-Results.xlsx
excel.write.results       = true

# Application accounts (public demo credentials published by the site itself) -
user.standard             = standard_user
user.locked               = locked_out_user
user.problem              = problem_user
user.performance          = performance_glitch_user
user.password             = secret_sauce

# Feature flags -------------------------------------------------------------
# Consumed by SkipScenarioTest: when a flag is off the test reports SKIPPED with
# a reason instead of failing or silently passing.
feature.loyalty.points    = false
feature.bulk.orders       = false
