name: UI Regression

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'   # nightly run
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run against
        type: choice
        options: [ chrome, edge, firefox ]
        default: chrome

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run regression suite
        run: >
          mvn -B clean test
          -Dbrowser=${{ github.event.inputs.browser || 'chrome' }}
          -Dheadless=true
          -Denv=ci

      # if: always() — failures are exactly when the report matters most
      - name: Publish report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/reports/
            target/screenshots/
            target/logs/
          retention-days: 14
