# ==========================================================
# Base configuration
# ----------------------------------------------------------
# Every key here can be overridden at run time:
#   mvn test -Dbrowser=edge -Dheadless=true -Denv=staging
# Environment overlays live in config-<env>.properties.
# ==========================================================

# --- Browser ---
browser=chrome
headless=false
browser.acceptInsecureCerts=false

# --- Timeouts (seconds) ---
# Implicit wait is intentionally absent. It is pinned to zero in DriverFactory
# because mixing implicit and explicit waits makes timeouts unpredictable.
timeout.explicit=15
timeout.pageload=45
timeout.script=30

# --- Retries ---
retry.count=1

# --- Debugging ---
# Outlines each element before interacting with it. Costs time; keep off in CI.
ui.highlight.enabled=false

# --- Application under test ---
url.javadocs=https://docs.oracle.com/javase/8/docs/api/
url.nestedFrames=https://the-internet.herokuapp.com/nested_frames
