# Root logger configuration
log4j.rootLogger=INFO, Console, File

# ===========================
# Console Appender
# ===========================
log4j.appender.Console=org.apache.log4j.ConsoleAppender
log4j.appender.Console.Target=System.out
log4j.appender.Console.layout=org.apache.log4j.PatternLayout
log4j.appender.Console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c{1} - %m%n

# ===========================
# File Appender (Rolling)
# ===========================
log4j.appender.File=org.apache.log4j.RollingFileAppender
log4j.appender.File.File=logs/selenium-test.log
log4j.appender.File.MaxFileSize=10MB
log4j.appender.File.MaxBackupIndex=5
log4j.appender.File.layout=org.apache.log4j.PatternLayout
log4j.appender.File.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c{1}:%L - %m%n
log4j.appender.File.Append=true

# ===========================
# Log Level Overrides
# ===========================

# Selenium WebDriver - reduce noise
log4j.logger.org.openqa.selenium=WARN
log4j.logger.org.openqa.selenium.remote=WARN
log4j.logger.org.openqa.selenium.support=INFO

# HTTP client used by Selenium
log4j.logger.org.apache.http=WARN
log4j.logger.org.apache.http.wire=ERROR

# Browser drivers
log4j.logger.io.github.bonigarcia.wdm=INFO

# Your test framework
log4j.logger.com.yourcompany.tests=DEBUG
log4j.logger.com.yourcompany.pages=DEBUG
log4j.logger.com.yourcompany.utils=DEBUG