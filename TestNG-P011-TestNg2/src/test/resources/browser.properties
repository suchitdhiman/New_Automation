# ========== BROWSER CONFIGURATION ==========

# Browser Selection (chrome, firefox, edge)
browser=chrome

# Optional: Browser headless mode (true/false)
headless=false

# Optional: Browser window size
window.size=1920,1080

# Optional: Browser timeout
implicit.wait=10
explicit.wait=10

# Optional: Browser options
disable.notifications=true
start.maximized=true

# Optional: Proxy settings (if required)
proxy.enabled=false
proxy.host=
proxy.port=