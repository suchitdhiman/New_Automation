# ========== AUTHENTICATION PAGE LOCATORS ==========
# Site: https://practicetestautomation.com/practice-test-login/
# Valid credentials: student / Password123

# Login Button
login_btn_xpath=//button[@id='submit']

# Username Input Field
username_id=username
username_xpath=//input[@id='username'] | //input[@name='username'] | //input[@placeholder='Username']
username_name=username

# Password Input Field
password_id=password
password_xpath=//input[@id='password'] | //input[@name='password'] | //input[@placeholder='Password']
password_name=password

# Sign In Button
signin_btn_id=submit
signin_btn_xpath=//button[@id='submit']

# Error Message
error_message_xpath=//div[@id='error'][contains(@class,'show')] | //*[contains(text(), 'is invalid!')]

# Dashboard/Home Page (after successful login)
dashboard_xpath=//h1[contains(text(), 'Logged In Successfully')] | //strong[contains(text(), 'Congratulations')]

# Logout Button
logout_btn_xpath=//a[contains(text(), 'Log out')]

# Remember Me Checkbox (not present on this site)
remember_me_checkbox_xpath=//input[@type='checkbox'][@name='remember'] | //input[@id='remember_me']

# Forgot Password Link
forgot_password_xpath=//a[contains(text(), 'Forgot')] | //*[@id='forgot-password']

# Sign Up Link
signup_link_xpath=//a[contains(text(), 'Sign up')] | //a[contains(text(), 'Register')]

# Password Visibility Toggle
password_toggle_xpath=//button[@class='password-toggle'] | //*[@id='togglePassword']

# Success Message
success_message_xpath=//div[@class='alert alert-success'] | //*[contains(text(), 'successfully')]

# Loading Spinner (to wait for page load)
loading_spinner_xpath=//div[@class='spinner'] | //*[@class='loading']

# Browser Back Button (for navigation)
browser_back_xpath=//button[@id='back'] | //a[@id='back']