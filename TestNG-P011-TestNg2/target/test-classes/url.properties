# ========== PRACTICE WEBSITES FOR AUTHENTICATION TESTING ==========

# Website 1: PracticeTestAutomation.com (RECOMMENDED)
# No OTP/Email verification required
# Valid Credentials: username=practice, password=SuperSecretPassword!
applicationUrl=https://practicetestautomation.com/practice-test-login/

# Alternative URLs (you can switch between these)

# Website 2: OpenCart Demo Store (Admin Login available)
# Username: demo, Password: demo
# Note: Demo credentials may vary, check the website
opencart_url=https://demo.opencart.com/admin/

# Website 3: Sauce Labs Practice Site
# Username: standard_user, Password: secret_sauce
sauce_labs_url=https://www.saucedemo.com/

# Website 4: HRM Practice Application (Free access)
# Username varies, usually email based
hrm_practice_url=https://opensource-demo.orangehrmlive.com/

# Website 5: OWASP WebGoat (Learning application)
# Note: May require some setup
webgoat_url=http://localhost:8080/WebGoat/

# Website 6: Dummy REST API (alternative)
# Not GUI based, requires API testing setup
rest_api_url=https://reqres.in/api/login

# ========== SELECTED APPLICATION FOR TESTS ==========
# Using PracticeTestAutomation.com as primary application
# Reason: 
# - No OTP/Email verification
# - Simple login form
# - Immediate response
# - No captcha
# - Free access
# - Consistent and reliable

targetApplication=practicetestautomation
environment=testing
testDataSource=database